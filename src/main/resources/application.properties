spring.application.name=profit-panel

# Base de datos (MySQL en Docker, ver docker-compose.yml)
spring.datasource.url=jdbc:mysql://localhost:3306/profit_panel
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:profitpanel}

# Crea/actualiza las tablas a partir de las entidades (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
